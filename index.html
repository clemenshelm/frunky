<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>Frunky</title>
<style>
  :root {
    --bg: #0b0d12;
    --text: #e9ecf2;
    --muted: #7c8698;
    --cyan: #46d4e0;
    --amber: #f2a65a;
    --hot: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 1rem; text-align: center; }
  /* the diagnostics and the footer must never be squeezed out by the drive
     screen — a log you cannot reach during the drive is not a log */
  #diag, #diagOpts, footer { flex: 0 0 auto; }

  /* the start screen is one enormous target — it is pressed before driving */
  #startScreen { gap: 2rem; }
  .brand {
    font-family: Futura, "Century Gothic", "Trebuchet MS", sans-serif;
    font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 500; letter-spacing: 0.02em;
  }
  .brand span { color: var(--cyan); }
  .tagline { color: var(--muted); font-size: clamp(0.95rem, 2.4vw, 1.15rem); max-width: 34ch; }
  #start {
    font-family: inherit; font-weight: 700;
    font-size: clamp(1.3rem, 3.4vw, 1.8rem);
    color: #06282c; background: var(--cyan);
    border: none; border-radius: 999px;
    padding: clamp(1.1rem, 3vh, 1.7rem) clamp(3rem, 12vw, 5.5rem);
    cursor: pointer; transition: filter 0.15s;
  }
  #start:active { filter: brightness(0.88); }
  #start:disabled { opacity: 0.5; }

  /* the drive screen is glanceable: one number, one word, nothing to read */
  #driveScreen { display: none; gap: 0.2rem; width: 100%; }
  body.driving #startScreen { display: none; }
  body.driving #driveScreen { display: flex; }
  .speed {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(5rem, 26vw, 16rem); line-height: 0.95; font-weight: 300;
    letter-spacing: -0.03em;
  }
  .unit { color: var(--muted); font-size: clamp(0.85rem, 2.6vw, 1.1rem);
          letter-spacing: 0.3em; text-transform: uppercase; }
  .state {
    margin-top: 1.4rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(1rem, 3.4vw, 1.5rem);
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--cyan);
    transition: color 0.3s;
  }
  .state.launch { color: var(--amber); }
  .state.high { color: var(--hot); }
  /* force meter: a single hairline that fills with thrust or braking */
  .force { width: min(72vw, 520px); height: 3px; margin-top: 1.5rem;
           background: #1c2230; border-radius: 2px; overflow: hidden; }
  .force i { display: block; height: 100%; width: 0%;
             background: linear-gradient(90deg, var(--cyan), var(--hot)); }

  footer { display: flex; align-items: center; justify-content: space-between;
           gap: 1rem; padding: 0.9rem 1.1rem; color: var(--muted); font-size: 0.78rem; }
  footer a { color: var(--muted); }
  #stop {
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    color: var(--muted); background: transparent;
    border: 1px solid #232a38; border-radius: 999px;
    padding: 0.55rem 1.4rem; cursor: pointer; visibility: hidden;
  }
  body.driving #stop { visibility: visible; }
  .note { color: var(--muted); font-size: 0.9rem; max-width: 40ch; line-height: 1.5; }
  .note.err { color: var(--amber); }
  /* field-test overlay: hidden until the footer is tapped, because the answers
     it gives (does this browser report speed? how often?) can only be found in
     a moving car — and must not be on screen while driving normally */
  #diag { display: none; padding: 0.6rem 1.1rem 0; color: var(--muted);
          font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.7rem;
          line-height: 1.7; word-spacing: 0.4em; }
  body.diag #diag { display: block; }
  #diagOpts { display: none; gap: 0.4rem; padding: 0.4rem 1.1rem 0; flex-wrap: wrap; }
  body.diag #diagOpts { display: flex; }
  #diagOpts button {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.7rem;
    color: var(--muted); background: transparent;
    border: 1px solid #232a38; border-radius: 5px;
    padding: 0.3rem 0.6rem; cursor: pointer;
  }
  #diagOpts button.on { color: var(--cyan); border-color: var(--cyan); }
  /* the log is the whole remote-debugging story: no backend, no streaming — a
     car has no console, but it has a screen you can read and photograph */
  #logView { display: none; position: fixed; inset: 0; background: var(--bg);
             padding: 1rem; overflow: auto; z-index: 10;
             font-family: ui-monospace, "SF Mono", Menlo, monospace;
             font-size: 0.72rem; line-height: 1.6; white-space: pre-wrap; }
  body.log #logView { display: block; }
  #logClose { position: fixed; right: 0.8rem; bottom: 0.8rem; font-family: inherit;
              font-size: 0.85rem; font-weight: 600; color: #06282c;
              background: var(--cyan); border: none; border-radius: 999px;
              padding: 0.6rem 1.4rem; cursor: pointer; }
  /* the trip summary is the point of a field test: an impression is not a
     result, and nobody can read a diagnostics line at 130 km/h */
  #trip { display: none; padding: 1.2rem 1.1rem; max-width: 46ch; margin: 0 auto; }
  body.done #trip { display: block; }
  body.done #startScreen, body.done #driveScreen { display: none; }
  #trip h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.7rem; }
  #trip dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; }
  #trip dt { color: var(--muted); }
  #trip dd { color: var(--text); }
  #again {
    margin-top: 1.2rem; font-family: inherit; font-size: 0.95rem; font-weight: 600;
    color: #06282c; background: var(--cyan);
    border: none; border-radius: 999px; padding: 0.7rem 1.8rem; cursor: pointer;
  }
</style>
</head>
<body>

<main id="startScreen">
  <p class="brand">Frun<span>ky</span></p>
  <p class="tagline">Die Fahrt komponiert. Du hörst nur zu.</p>
  <button id="start">Losfahren</button>
  <p class="note" id="startNote">Braucht Standortfreigabe — die Musik folgt Beschleunigung,
    Bremsen und Kurven. Vor der Fahrt starten.</p>
</main>

<main id="driveScreen">
  <p class="speed" id="speed">0</p>
  <p class="unit">km/h</p>
  <p class="state" id="state">Warte auf GPS</p>
  <div class="force"><i id="forceBar"></i></div>
</main>

<main id="trip">
  <h2>Fahrt ausgewertet</h2>
  <dl id="tripBody"></dl>
  <button id="again">Neue Fahrt</button>
</main>

<p id="diag"></p>
<div id="diagOpts">
  <button id="optCurve">Kurve: aussen</button>
  <button id="optDepth">Trägheits-Tiefe: an</button>
  <button id="optLite">Sparmodus: aus</button>
  <button id="optLog">Protokoll</button>
</div>
<pre id="logView"></pre><button id="logClose" hidden>Schliessen</button>
<footer>
  <span id="foot">Frunky</span>
  <button id="stop">Beenden</button>
</footer>

<script src="vendor/Tone.js"></script>
<script src="engine.js?v=12"></script>
<script src="geo.js?v=12"></script>
<script>
(() => {
  "use strict";
  // Bumped on every deploy. A car browser has no hard reload, so the only way
  // to know whether a trip tested the code we shipped is to read it back —
  // three reports in a row turned out to be the same stale build.
  // (Loading the page as ?v=<something-new> is what forces a fresh copy.)
  const BUILD = "12";
  const el = (id) => document.getElementById(id);
  const startBtn = el("start"), stopBtn = el("stop");
  const speedEl = el("speed"), stateEl = el("state"), forceEl = el("forceBar");
  const noteEl = el("startNote");

  const diagEl = el("diag");
  const reader = FrunkyGeo.createReader();
  let watchId = null, wakeLock = null, gotFix = false;

  // ---- trip recording ------------------------------------------------------
  // What a field test has to answer is factual — does this browser report a
  // speed, how often does a fix arrive, how accurate is it — and none of it can
  // be read off the screen while driving. So the drive records itself and the
  // numbers are shown once it is over.
  const trip = {
    startedAt: 0, fixes: 0, fromCoords: 0, coarse: 0, rejected: 0,
    intervals: [], accuracies: [],
    maxSpeed: 0, maxForce: 0, maxLat: 0, staleMs: 0, lastSampleAt: 0,
    clockFallback: 0, errors: 0, lastError: "", skipped: 0,
  };
  const median = (a) => {
    if (!a.length) return null;
    const v = a.slice().sort((x, y) => x - y);
    return v[Math.floor(v.length / 2)];
  };

  // tap the footer to reveal what the receiver is actually delivering. The
  // in-car test's real question is whether this browser reports coords.speed
  // and coords.heading at all — everything else can be tuned afterwards
  el("foot").addEventListener("click", () => document.body.classList.toggle("diag"));

  // ---- the log --------------------------------------------------------------
  // A car has no console. Everything worth knowing goes into the engine's ring
  // and is rendered on demand — readable, photographable, no backend involved.
  // (Streaming it somewhere would be genuinely useful for other people later,
  // but a GPS trace is personal data and that is not a switch to flip casually.)
  window.addEventListener("error", (e) => {
    Frunky.log("js", (e.message || "error") + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno);
  });
  window.addEventListener("unhandledrejection", (e) => {
    Frunky.log("js", "unhandled: " + ((e.reason && e.reason.message) || e.reason));
  });
  const logView = el("logView"), logClose = el("logClose");
  function renderLog() {
    const h = Frunky.health();
    const d = reader.diagnostics(Date.now());
    const lines = [
      "FRUNKY build " + BUILD + " · " + document.lastModified,
      "",
      "audio      " + h.audio + (h.running ? " · läuft" : " · gestoppt"),
      "steps      " + h.step,
      "fehler     " + h.errors + " · resumes " + h.resumes + " · stalls " + h.stalls,
      "verspätet  " + h.lateSteps + " steps · max " + Math.round(h.worstLate * 1000) + " ms",
      "eingefroren " + freezes + "× · max " + Math.round(worstFreeze) + " ms",
      "last       " + Math.round(h.load * 100) + "% · spitze " + Math.round(h.peakLoad * 100) + "%",
      "vereinfacht " + (h.strain > 0.5 ? "JETZT" : "nein") + " · " + Math.round(h.strainPct) + "% der zeit",
      "sparmodus  " + (Frunky.options().lite ? "an" : "aus"),
      "",
      "gps fixes  " + d.fixes + " · verworfen " + d.rejected,
      "gps alter  " + (d.ageMs == null ? "—" : Math.round(d.ageMs) + " ms") +
        " · takt " + (d.intervalMs == null ? "—" : Math.round(d.intervalMs) + " ms"),
      "gps genau  " + (d.accuracy == null ? "—" : Math.round(d.accuracy) + " m"),
      "gps quelle " + d.speedSource + "/" + d.headingSource +
        " · uhr " + (trip.clockFallback ? "ankunft" : "gerät"),
      "gps fehler " + trip.errors + (trip.lastError ? " (" + trip.lastError + ")" : "") +
        " · übersprungen " + trip.skipped,
      "",
      "ereignisse:",
    ];
    for (const e of h.events) lines.push("  " + e.at + "ms " + e.kind + ": " + e.text);
    if (!h.events.length) lines.push("  (keine)");
    logView.textContent = lines.join("\n");
  }
  let logTimer = null;
  el("optLog").addEventListener("click", () => {
    document.body.classList.add("log");
    logClose.hidden = false;
    renderLog();
    logTimer = setInterval(renderLog, 1000);
  });
  logClose.addEventListener("click", () => {
    document.body.classList.remove("log");
    logClose.hidden = true;
    if (logTimer) { clearInterval(logTimer); logTimer = null; }
  });

  // the A/B a field test needs: whether the inertial reading feels right is a
  // question about the body, and a question needs two answers to compare
  const optCurve = el("optCurve"), optDepth = el("optDepth");
  const optLite = document.getElementById("optLite");
  function paintOpts() {
    const o = Frunky.options();
    optCurve.textContent = "Kurve: " + (o.curveOutward ? "aussen" : "innen");
    optCurve.classList.toggle("on", o.curveOutward);
    optDepth.textContent = "Trägheits-Tiefe: " + (o.inertiaDepth ? "an" : "aus");
    optDepth.classList.toggle("on", o.inertiaDepth);
    // the low-power graph is BUILT, so switching it is a restart, not a fade
    optLite.textContent = "Sparmodus: " + (o.lite ? "an" : "aus") +
      (Frunky.isRunning() ? " (Neustart)" : "");
    optLite.classList.toggle("on", o.lite);
  }
  optLite.addEventListener("click", () => {
    Frunky.setOption("lite", !Frunky.options().lite); paintOpts();
  });
  optCurve.addEventListener("click", () => {
    Frunky.setOption("curveOutward", !Frunky.options().curveOutward); paintOpts();
  });
  optDepth.addEventListener("click", () => {
    Frunky.setOption("inertiaDepth", !Frunky.options().inertiaDepth); paintOpts();
  });
  paintOpts();

  function note(text, isError) {
    noteEl.textContent = text;
    noteEl.className = "note" + (isError ? " err" : "");
  }

  // the screen must not sleep mid-drive; not every car browser grants this,
  // and a refusal is not worth telling the driver about
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (err) { void err; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && document.body.classList.contains("driving")) {
      keepAwake();
      Frunky.resume(); // a backgrounded car browser may suspend the audio clock
    }
  });

  // The Tesla delivers about ten fixes a second. One or two is all the music can
  // use — it smooths and dead-reckons between them anyway — and every extra one
  // is main-thread work on a device that has none to spare
  const MIN_FIX_GAP_MS = 180;
  let lastFixAccepted = 0;
  function onFix(pos) {
    gotFix = true;
    const arrivedNow = Date.now();
    if (arrivedNow - lastFixAccepted < MIN_FIX_GAP_MS) { trip.skipped++; return; }
    lastFixAccepted = arrivedNow;
    const c = pos.coords;
    const before = reader.diagnostics(Date.now());
    trip.fixes++;
    if (Number.isFinite(c.speed) && c.speed >= 0) trip.fromCoords++;
    if (Number.isFinite(c.accuracy)) trip.accuracies.push(c.accuracy);
    // position.timestamp is not guaranteed to be on our clock — see fixTime
    const arrived = Date.now();
    const t = FrunkyGeo.fixTime(pos.timestamp, arrived);
    if (t !== pos.timestamp) trip.clockFallback++;
    reader.push({
      lat: c.latitude, lon: c.longitude,
      speed: c.speed, heading: c.heading, accuracy: c.accuracy,
      t,
    });
    const after = reader.diagnostics(Date.now());
    if (trip.fixes <= 3 || trip.fixes % 25 === 0) {
      Frunky.log("gps", "fix " + trip.fixes + " takt=" +
        (after.intervalMs == null ? "—" : Math.round(after.intervalMs)) +
        " genau=" + (after.accuracy == null ? "—" : Math.round(after.accuracy)) +
        " quelle=" + after.speedSource + (t !== pos.timestamp ? " uhr=ankunft" : ""));
    }
    if (after.intervalMs != null) trip.intervals.push(after.intervalMs);
    if (after.speedSource === "grob") trip.coarse++;
    if (after.rejected > before.rejected) trip.rejected++;
  }
  function onGeoError(err) {
    const msg = err.code === 1
      ? "Standort abgelehnt. Im Browser erlauben und neu starten."
      : err.code === 3
      ? "Kein GPS-Signal. Freie Sicht zum Himmel abwarten."
      : "Standort nicht verfügbar.";
    trip.errors++;
    trip.lastError = ["", "abgelehnt", "nicht verfügbar", "Zeitüberschreitung"][err.code] || "Fehler";
    Frunky.log("gps", "fehler " + err.code + ": " + (err.message || trip.lastError));
    if (!document.body.classList.contains("driving")) note(msg, true);
    // while driving, the diagnostics line already carries the detail — and it
    // opens itself when the signal is gone, so the failure explains itself
  }

  async function start() {
    if (!("geolocation" in navigator)) {
      note("Dieser Browser kennt keine Standortbestimmung.", true);
      return;
    }
    startBtn.disabled = true;
    note("Audio wird vorbereitet …", false);
    try {
      await Frunky.start();
    } catch (err) {
      console.error(err);
      note("Audio konnte nicht starten. Seite neu laden.", true);
      startBtn.disabled = false;
      return;
    }
    // maximumAge 0 with a short timeout asks a car browser for a brand-new fix
    // every time and gives up quickly when it is slow; a couple of seconds of
    // cache is fine for music, and a generous timeout keeps the watch alive
    watchId = navigator.geolocation.watchPosition(onFix, onGeoError, {
      enableHighAccuracy: true, maximumAge: 2000, timeout: 60000,
    });
    keepAwake();
    trip.startedAt = Date.now();
    trip.lastSampleAt = 0;
    document.body.classList.remove("done");
    document.body.classList.add("driving");
    startBtn.disabled = false;
  }

  function showTrip() {
    const mins = (Date.now() - trip.startedAt) / 60000;
    const iv = median(trip.intervals), acc = median(trip.accuracies);
    const rows = [
      ["Version", BUILD],
      ["Dauer", mins.toFixed(1) + " min"],
      ["GPS-Fixes", String(trip.fixes)],
      ["Takt (Median)", iv == null ? "—" : Math.round(iv) + " ms"],
      ["Genauigkeit (Median)", acc == null ? "—" : Math.round(acc) + " m"],
      ["Tempo vom Browser", trip.fixes ? Math.round((trip.fromCoords / trip.fixes) * 100) + " %" : "—"],
      ["Fixes zu ungenau", String(trip.coarse)],
      ["Sprünge verworfen", String(trip.rejected)],
      ["Ohne Signal", (trip.staleMs / 1000).toFixed(0) + " s"],
      ["Standort-Fehler", trip.errors ? trip.errors + " (" + trip.lastError + ")" : "0"],
      ["Zeitstempel", trip.clockFallback ? "Ankunftszeit (Gerät unbrauchbar)" : "vom Gerät"],
      ["Audio-Last (Schnitt)", Math.round(Frunky.load() * 100) + " %"],
      ["Audio-Last (Spitze)", Math.round(Frunky.peakLoad() * 100) + " %"],
      ["Sparmodus", Frunky.options().lite ? "an" : "aus"],
      ["Vereinfacht", Math.round(Frunky.health().strainPct) + " % der Zeit"],
      ["Scheduler verspätet", Frunky.health().lateSteps + " Schritte, max " +
        Math.round(Frunky.health().worstLate * 1000) + " ms"],
      ["Transport-Stillstände", String(Frunky.health().stalls)],
      ["Seite eingefroren", freezes + "× , max " + Math.round(worstFreeze) + " ms"],
      ["Fixes verworfen (zu dicht)", String(trip.skipped)],
      ["Höchsttempo", Math.round(trip.maxSpeed) + " km/h"],
      ["Stärkste Kraft", Math.round(trip.maxForce * 100) + " %"],
      ["Stärkste Querkraft", trip.maxLat.toFixed(2)],
      ["Kurve", Frunky.options().curveOutward ? "aussen" : "innen"],
      ["Trägheits-Tiefe", Frunky.options().inertiaDepth ? "an" : "aus"],
    ];
    el("tripBody").innerHTML = rows
      .map(([k, v]) => "<dt>" + k + "</dt><dd>" + v + "</dd>").join("");
    document.body.classList.add("done");
  }

  function stop() {
    Frunky.stop();
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (wakeLock) { try { wakeLock.release(); } catch (err) { void err; } wakeLock = null; }
    document.body.classList.remove("driving");
    if (trip.startedAt) showTrip();
    note("Braucht Standortfreigabe — die Musik folgt Beschleunigung, Bremsen und Kurven."
      + " Vor der Fahrt starten.", false);
  }

  function beginTrip() {
    document.body.classList.remove("done");
    Object.assign(trip, { startedAt: 0, fixes: 0, fromCoords: 0, coarse: 0,
      rejected: 0, intervals: [], accuracies: [], maxSpeed: 0, maxForce: 0,
      maxLat: 0, staleMs: 0, lastSampleAt: 0, clockFallback: 0, errors: 0,
      lastError: "", skipped: 0 });
    freezes = 0; worstFreeze = 0; wasStale = false;
    start();
  }
  startBtn.addEventListener("click", beginTrip);
  el("again").addEventListener("click", beginTrip);
  stopBtn.addEventListener("click", stop);

  // Writing the readouts every frame means a layout pass every frame, and the
  // speed digits are rendered at a quarter of the screen height. On a car
  // browser that competes with the audio thread for the same modest CPU, so
  // each element is only touched when its value actually changed
  let shownSpeed = -1, shownState = "", shownForce = -1;
  let lastFrame = performance.now();
  let lastDiagAt = 0, wasStale = false, freezes = 0, worstFreeze = 0;
  function frame(now) {
    const gap = now - lastFrame;
    // The decisive measurement. If the main thread stops, the music stops with
    // it, GPS callbacks stop, AND the stall watchdog stops — because it needs
    // this same thread to count. A run that loses both sound and position while
    // reporting zero stalls is a frozen page, and this is the only thing that
    // can say so
    if (gap > 400 && lastFrame) {
      freezes++;
      worstFreeze = Math.max(worstFreeze, gap);
      Frunky.log("freeze", Math.round(gap) + "ms with no frame at all");
    }
    const dt = Math.min(0.1, gap / 1000);
    lastFrame = now;
    if (Frunky.isRunning()) {
      const input = reader.sample(Date.now(), dt);
      Frunky.update(dt, input);

      const kmh = Math.round(input.speed);
      if (kmh !== shownSpeed) { shownSpeed = kmh; speedEl.textContent = String(kmh); }
      const st = Frunky.status();
      // never show a musical state on top of a signal that stopped arriving:
      // a frozen number reads as a working readout, which is worse than none
      const stale = reader.isStale(Date.now());
      // "no signal" with nothing behind it is unactionable in a moving car, so
      // the diagnostics open themselves the moment it happens
      if (stale !== wasStale && gotFix) {
        wasStale = stale;
        Frunky.log("gps", (stale ? "signal lost" : "signal back") +
          " after " + trip.fixes + " fixes");
      }
      if (stale && gotFix) document.body.classList.add("diag");
      const text = !gotFix ? "Warte auf GPS" : stale ? "Kein GPS-Signal" : st.text;
      if (text !== shownState) {
        shownState = text;
        stateEl.textContent = text;
        stateEl.className = "state " + (gotFix && !stale ? st.kind : "");
      }
      const f = Math.round(Frunky.force() * 50) * 2; // 2 % steps
      if (f !== shownForce) { shownForce = f; forceEl.style.width = f + "%"; }

      trip.maxSpeed = Math.max(trip.maxSpeed, input.speed);
      trip.maxForce = Math.max(trip.maxForce, Frunky.force());
      trip.maxLat = Math.max(trip.maxLat, Math.abs(input.lateralG));
      const nowMs = Date.now();
      if (stale && trip.lastSampleAt) trip.staleMs += nowMs - trip.lastSampleAt;
      trip.lastSampleAt = nowMs;

      // four times a second is plenty to read, and this rebuilds a long string,
      // copies the event ring and touches the DOM every single time
      if (document.body.classList.contains("diag") && now - lastDiagAt > 250) {
        lastDiagAt = now;
        const d = reader.diagnostics(Date.now());
        diagEl.textContent =
          "fixes " + d.fixes +
          " · alt " + (d.ageMs == null ? "—" : Math.round(d.ageMs) + "ms") +
          " · takt " + (d.intervalMs == null ? "—" : Math.round(d.intervalMs) + "ms") +
          " · genau " + (d.accuracy == null ? "—" : Math.round(d.accuracy) + "m") +
          " · speed " + d.speedSource +
          " · kurs " + d.headingSource +
          " · verworfen " + d.rejected +
          " · uhr " + (trip.clockFallback ? "ankunft" : "gerät") +
          " · fehler " + (trip.errors ? trip.errors + " (" + trip.lastError + ")" : "0") +
          " · g " + input.lateralG.toFixed(2) +
          " · last " + Math.round(Frunky.load() * 100) + "%" +
          (Frunky.health().strain > 0.5 ? " · VEREINFACHT" : "");
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // build stamp, so a stale cached copy can never be mistaken for the live one
  const foot = el("foot");
  if (foot) {
    foot.textContent = "Frunky · " + document.lastModified +
      (location.protocol === "file:" ? " · LOKALE KOPIE" : "");
  }
})();
</script>
</body>
</html>
